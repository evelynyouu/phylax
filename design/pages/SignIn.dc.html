<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Phylax</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F7F3F5;color:#1E2B22;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#344C3D}a:hover{color:#1E2B22}
.b-primary:hover{background:#26392D !important;color:#FFFFFF !important}
.b-ghost:hover{background:#EDE6EA !important}
input:focus{outline:none;border-color:#344C3D !important;box-shadow:0 0 0 3px #D0DBE7}
:focus-visible{outline:3px solid #344C3D;outline-offset:3px}
.sway{animation:sway 9s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@media (prefers-reduced-motion: reduce){.sway{animation:none}}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 900px; display: flex; flex-wrap: wrap;">

  <aside style="flex: 1 1 420px; min-width: 0; background: #344C3D; color: #F7F3F5; padding: 32px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 40px; position: relative; overflow: hidden;">
    <a href="Main.dc.html" style="font-family: Gloock, Georgia, serif; font-size: 26px; color: #F7F3F5; text-decoration: none; position: relative; z-index: 1;">Phylax</a>
    <div aria-hidden="true" class="sway" style="position: relative; width: 300px; height: 360px; margin: auto;">
      <span style="position: absolute; left: 146px; top: 150px; width: 8px; height: 210px; background: #829672; border-radius: 4px;"></span>
      <span style="position: absolute; left: 150px; top: 250px; width: 80px; height: 36px; background: #829672; border-radius: 50% 0 50% 0; transform: rotate(-20deg);"></span>
      <span style="position: absolute; left: 70px; top: 290px; width: 80px; height: 36px; background: #A3B394; border-radius: 0 50% 0 50%; transform: rotate(20deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #D8959B; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(0deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #E3DADE; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(60deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #D0DBE7; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(120deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #D8959B; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(180deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #E3DADE; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(240deg);"></span>
      <span style="position: absolute; left: 120px; top: 30px; width: 60px; height: 120px; background: #D0DBE7; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%; transform: rotate(300deg);"></span>
      <span style="position: absolute; left: 130px; top: 130px; width: 40px; height: 40px; background: #829672; border-radius: 50%; box-shadow: inset 0 -5px 10px rgba(30,43,34,0.3);"></span>
    </div>
    <p style="margin: 0; font-family: Gloock, Georgia, serif; font-size: 34px; line-height: 1.1; max-width: 12em; position: relative; z-index: 1;">Welcome back. Your list kept growing while you were away.</p>
  </aside>

  <main style="flex: 1 1 520px; min-width: 0; padding: 32px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center;">
    <div style="width: 100%; max-width: 420px;">
      <h1 style="margin: 0; font-family: Gloock, Georgia, serif; font-weight: 400; font-size: 52px; line-height: 1;">Sign in</h1>
      <p style="margin: 12px 0 0; font-size: 16px; color: #3F4D44;">Use the Google account whose Gmail you connected.</p>

      <a class="b-ghost" href="Dashboard.dc.html" style="margin-top: 28px; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; border-radius: 999px; border: 1.5px solid #D6CBD0; background: #FFFFFF; color: #1E2B22; font-weight: 600; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.7-2.4 3.5v2.9h3.9c2.2-2.1 3.5-5.1 3.5-8.5z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.3 7.3 24 12 24z"></path><path fill="#FBBC05" d="M5.3 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.3C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"></path></svg>
        Continue with Google
      </a>

      <div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; margin: 26px 0; color: #5E6B62; font-size: 14px;"><span style="flex: 1; height: 1px; background: #E0D6DB;"></span>or use email<span style="flex: 1; height: 1px; background: #E0D6DB;"></span></div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="si-email" style="font-size: 14px; font-weight: 600;">Email</label>
        <input id="si-email" type="email" autocomplete="email" value="{{email}}" onInput="{{setEmail}}" placeholder="you@berkeley.edu" style="min-height: 50px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D6CBD0; background: #FFFFFF; font: inherit; color: #1E2B22;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 18px;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label for="si-pw" style="font-size: 14px; font-weight: 600;">Password</label>
          <a href="#" style="font-size: 14px;">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input id="si-pw" type="{{pwType}}" autocomplete="current-password" style="width: 100%; box-sizing: border-box; min-height: 50px; padding: 0 84px 0 16px; border-radius: 14px; border: 1.5px solid #D6CBD0; background: #FFFFFF; font: inherit; color: #1E2B22;">
          <button type="button" onClick="{{togglePw}}" aria-label="{{pwAria}}" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #344C3D; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">{{pwLabel}}</button>
        </div>
      </div>

      <a class="b-primary" href="Dashboard.dc.html" style="margin-top: 26px; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #344C3D; color: #FFFFFF; font-weight: 600; text-decoration: none;">Sign in</a>

      <p style="margin: 24px 0 0; font-size: 15px; color: #3F4D44; text-align: center;">New to Phylax? <a href="SignUp.dc.html" style="font-weight: 600;">Create an account</a></p>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { show: false, email: '' };

  renderVals() {
    var self = this;
    var show = this.state.show;
    return {
      email: this.state.email,
      setEmail: function (e) { self.setState({ email: e.target.value }); },
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Hide' : 'Show',
      pwAria: show ? 'Hide password' : 'Show password',
      togglePw: function () { self.setState({ show: !self.state.show }); }
    };
  }
}
</script>
</body>
</html>
