<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in to Phylax</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F7F3F5;color:#1E2B22;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#344C3D}a:hover{color:#1E2B22}
.b-primary:hover{background:#26392D !important;color:#FFFFFF !important}
.b-ghost:hover{background:#F7F3F5 !important;border-color:#B9AEB4 !important}
input:focus{outline:none;border-color:#344C3D !important;box-shadow:0 0 0 3px #D0DBE7}
:focus-visible{outline:3px solid #344C3D;outline-offset:3px}
.sway{animation:sway 6s ease-in-out infinite;transform-origin:50% 50%}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){.sway{animation:none}}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; min-height: 900px; display: flex; flex-direction: column; background: radial-gradient(1100px 520px at 50% -120px, #E6ECDF 0%, rgba(230,236,223,0) 70%), #F7F3F5;">
  <header style="box-sizing: border-box; width: 100%; max-width: 1240px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px;">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1E2B22;">
      <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 9px; background: #FFFFFF; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,43,34,0.1);">
        <svg width="22" height="22" viewBox="0 0 32 32"><g fill="none" stroke="#344C3D" stroke-width="2"><path d="M16 16c-4-6-4-11 0-13 4 2 4 7 0 13z" fill="#D8959B"></path><path d="M16 16c6-4 11-4 13 0-2 4-7 4-13 0z" fill="#D0DBE7"></path><path d="M16 16c4 6 4 11 0 13-4-2-4-7 0-13z" fill="#E3DADE"></path><path d="M16 16c-6 4-11 4-13 0 2-4 7-4 13 0z" fill="#829672"></path></g></svg>
      </span>
      <span style="font-weight: 600; font-size: 18px;">Phylax</span>
    </a>
    <p style="margin: 0; font-size: 14px; color: #5E6B62;">New here? <a href="SignUp.dc.html" style="font-weight: 600;">Create an account</a></p>
  </header>
  <main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px 72px;">
    <section style="box-sizing: border-box; width: 100%; max-width: 440px; background: #FFFFFF; border-radius: 28px; padding: 40px clamp(22px, 5vw, 40px) 34px; box-shadow: 0 1px 0 rgba(30,43,34,0.04), 0 24px 60px rgba(52,76,61,0.10); text-align: center;">
      <span aria-hidden="true" style="display: inline-grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; background: #F7F3F5;">
        <svg class="sway" width="32" height="32" viewBox="0 0 32 32"><g fill="none" stroke="#344C3D" stroke-width="2"><path d="M16 16c-4-6-4-11 0-13 4 2 4 7 0 13z" fill="#D8959B"></path><path d="M16 16c6-4 11-4 13 0-2 4-7 4-13 0z" fill="#D0DBE7"></path><path d="M16 16c4 6 4 11 0 13-4-2-4-7 0-13z" fill="#E3DADE"></path><path d="M16 16c-6 4-11 4-13 0 2-4 7-4 13 0z" fill="#829672"></path></g></svg>
      </span>
      <h1 style="margin: 18px 0 0; font-family: Gloock, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1.05;">Welcome back</h1>
      <p style="margin: 10px auto 0; max-width: 24em; font-size: 15px; line-height: 1.55; color: #3F4D44;">Your list kept growing while you were away.</p>

      <a class="b-ghost" href="Dashboard.dc.html" style="margin-top: 28px; display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; border-radius: 999px; border: 1.5px solid #E0D6DB; background: #FFFFFF; color: #1E2B22; font-weight: 600; text-decoration: none;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.7-2.4 3.5v2.9h3.9c2.2-2.1 3.5-5.1 3.5-8.5z"></path><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3c-1.1.7-2.5 1.2-4.1 1.2-3.1 0-5.8-2.1-6.7-5H1.3v3.1C3.3 21.3 7.3 24 12 24z"></path><path fill="#FBBC05" d="M5.3 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.3C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l4-3.1z"></path><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4 3.1c.9-2.9 3.6-4.9 6.7-4.9z"></path></svg>
        Continue with Google
      </a>

      <div aria-hidden="true" style="display: flex; align-items: center; gap: 14px; margin: 26px 0; color: #5E6B62; font-size: 14px;"><span style="flex: 1; height: 1px; background: #E0D6DB;"></span>or use email<span style="flex: 1; height: 1px; background: #E0D6DB;"></span></div>

      <div style="display: flex; flex-direction: column; gap: 8px; text-align: left;">
        <label for="si-email" style="font-size: 14px; font-weight: 600;">Email</label>
        <input id="si-email" type="email" autocomplete="email" value="{{email}}" onInput="{{setEmail}}" placeholder="example@gmail.com" style="min-height: 50px; padding: 0 16px; border-radius: 14px; border: 1.5px solid #E0D6DB; background: #FFFFFF; font: inherit; color: #1E2B22;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 16px; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <label for="si-pw" style="font-size: 14px; font-weight: 600;">Password</label>
          <a href="#" style="font-size: 14px;">Forgot password?</a>
        </div>
        <div style="position: relative;">
          <input id="si-pw" type="{{pwType}}" autocomplete="current-password" style="width: 100%; box-sizing: border-box; min-height: 50px; padding: 0 84px 0 16px; border-radius: 14px; border: 1.5px solid #E0D6DB; background: #FFFFFF; font: inherit; color: #1E2B22;">
          <button type="button" onClick="{{togglePw}}" aria-label="{{pwAria}}" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #344C3D; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">{{pwLabel}}</button>
        </div>
      </div>

      <a class="b-primary" href="Dashboard.dc.html" style="margin-top: 26px; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; background: #344C3D; color: #FFFFFF; font-weight: 600; text-decoration: none;">Sign in</a>

    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { show: false, email: '' };

  renderVals() {
    var self = this;
    var show = this.state.show;
    return {
      email: this.state.email,
      setEmail: function (e) { self.setState({ email: e.target.value }); },
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Hide' : 'Show',
      pwAria: show ? 'Hide password' : 'Show password',
      togglePw: function () { self.setState({ show: !self.state.show }); }
    };
  }
}
</script>
</body>
</html>
